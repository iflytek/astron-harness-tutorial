name: doc-watch tests

on:
  pull_request:
    paths:
      - 'scripts/doc-watch/**'
      - 'scripts/sync-astudio-images.mjs'
      - 'scripts/tests/astudio-assets.test.mjs'
      - 'docs/public/astudio/**'
      - 'docs/guide/astudio/**'
      - 'docs/en/guide/astudio/**'
      - 'package.json'
      - '.github/workflows/doc-watch-test.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/doc-watch/**'
      - 'scripts/sync-astudio-images.mjs'
      - 'scripts/tests/astudio-assets.test.mjs'
      - 'docs/public/astudio/**'
      - 'docs/guide/astudio/**'
      - 'docs/en/guide/astudio/**'
      - 'package.json'
      - '.github/workflows/doc-watch-test.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:doc-watch
      - run: npm run test:assets
