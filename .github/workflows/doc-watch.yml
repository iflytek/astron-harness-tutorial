name: doc-watch

# Daily upstream capture, bilingual tutorial updates, validated PR and Pages deployment.

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Capture and upload reports without issues, comments or PRs'
        type: boolean
        default: false

concurrency:
  group: doc-watch-main
  cancel-in-progress: false

permissions:
  actions: write
  checks: read
  statuses: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run doc-watch
        id: watch
        run: |
          set +e
          node scripts/doc-watch/check-updates.mjs --json --update --report doc-watch-report.md >doc-watch-changes.json 2> doc-watch-stderr.log
          code=$?
          if [ "$code" -eq 0 ] && jq -e 'any(.[]; (.changes.newPages + .changes.changedPages + .changes.removedPages | length) > 0)' doc-watch-changes.json >/dev/null; then code=1; fi
          node scripts/sync-astudio-images.mjs --check --report doc-watch-images.md 2>> doc-watch-stderr.log
          image_code=$?
          if [ -f doc-watch-images.md ]; then
            printf '\n' >> doc-watch-report.md
            cat doc-watch-images.md >> doc-watch-report.md
          fi
          if [ "$image_code" -gt 1 ] || [ "$code" -gt 1 ]; then code=2; fi
          if [ "$image_code" -eq 1 ] && [ "$code" -eq 0 ]; then code=1; fi
          cat doc-watch-stderr.log >&2
          echo "code=$code" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upsert summary issue on changes
        if: inputs.dry_run != true && steps.watch.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY_FILE=doc-watch-report.md
          {
            echo ""
            echo "---"
            echo "_由 \`doc-watch\` 工作流自动生成 · run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
            echo ""
            echo "工作流验证教程与图片后将提交 PR，合并时关闭本 Issue。"
          } >> "$BODY_FILE"

          TITLE="[doc-watch] 上游文档有新增内容待补全"
          # 按标题精确匹配：同标签下还可能有抓取失败的 Issue，不能取第一条了事。
          EXISTING=$(gh issue list --label doc-watch --state open --limit 100 --json number,title \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file "$BODY_FILE"
            gh issue comment "$EXISTING" --body "🔄 巡检报告已于本次 run 更新（run #${{ github.run_number }}）。"
            echo "Updated issue #$EXISTING"
          else
            gh label create doc-watch --color FBCA04 --description "上游文档巡检" 2>/dev/null || true
            gh issue create --title "$TITLE" --label doc-watch --body-file "$BODY_FILE"
          fi

      - name: Synchronize illustrations and bilingual tutorial content
        if: inputs.dry_run != true && steps.watch.outputs.code == '1'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          node scripts/sync-astudio-images.mjs --write
          node scripts/doc-watch/sync-guides.mjs doc-watch-changes.json

      - name: Validate and publish tutorial PR
        if: inputs.dry_run != true && steps.watch.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          DOC_WATCH_REVIEWER: ${{ vars.DOC_WATCH_REVIEWER }}
        run: |
          npm ci
          npm run test:doc-watch
          npm run test:assets
          node --test scripts/doc-watch/sync-guides.test.mjs
          npm test
          bash scripts/doc-watch/publish-sync.sh

      - name: Report capture failure
        if: inputs.dry_run != true && steps.watch.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[doc-watch] ⚠️ 巡检抓取失败"
          RUN_LINK="run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          {
            echo "doc-watch 工作流抓取上游文档时出错（$RUN_LINK）。可能是上游站点改版或网络问题。"
            echo ""
            echo '```'
            tail -n 20 doc-watch-stderr.log
            echo '```'
          } > doc-watch-failure.md

          # 连续失败只维护一条 Issue，不再每次新开。
          EXISTING=$(gh issue list --label doc-watch --state open --limit 100 --json number,title \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file doc-watch-failure.md
            echo "Commented on issue #$EXISTING"
          else
            gh label create doc-watch --color FBCA04 --description "上游文档巡检" 2>/dev/null || true
            gh issue create --title "$TITLE" --label doc-watch --body-file doc-watch-failure.md
          fi

      - name: Close capture-failure issue after recovery
        if: ${{ !inputs.dry_run && (steps.watch.outputs.code == '0' || steps.watch.outputs.code == '1') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[doc-watch] ⚠️ 巡检抓取失败"
          gh issue list --label doc-watch --state open --limit 100 --json number,title \
            | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number' \
            | while read -r n; do
                gh issue close "$n" --comment "✅ run #${{ github.run_number }} 抓取恢复正常，自动关闭。"
              done

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-watch-report
          path: |
            doc-watch-report.md
            doc-watch-stderr.log
            doc-watch-images.md

      - name: Fail on incomplete capture
        if: steps.watch.outputs.code == '2'
        run: exit 1
